name: 一次性中文翻译键整理

on:
  push:
    branches:
      - main
    paths:
      - tools/reorganize_chinese_translation_keys.py
      - .github/workflows/reorganize-chinese-translation-keys.yml

permissions:
  contents: write

concurrency:
  group: reorganize-chinese-translation-keys
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 整理中文翻译键及引用
        run: python3 tools/reorganize_chinese_translation_keys.py

      - name: 提交整理结果
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
            exit 0
          fi
          git commit -m "整理中文翻译键结构及引用"
          git push origin HEAD:main
