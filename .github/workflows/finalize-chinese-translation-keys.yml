name: 中文翻译键最终收口

on:
  push:
    branches:
      - main
    paths:
      - tools/finalize_chinese_translation_keys.py
      - .github/workflows/finalize-chinese-translation-keys.yml

permissions:
  contents: write

concurrency:
  group: finalize-chinese-translation-keys
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 收口中文翻译键命名与归类
        run: python3 tools/finalize_chinese_translation_keys.py

      - name: 提交收口结果
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
            exit 0
          fi
          git commit -m "收口中文翻译键命名与系统归类"
          git push origin HEAD:main
