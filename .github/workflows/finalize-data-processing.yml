name: 数据处理动态分配最终收口

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-data-processing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 应用最终源码修复
        run: python3 .github/scripts/finalize_data_processing.py

      - name: 提交修复并清理临时文件
        shell: bash
        run: |
          rm -f .github/workflows/finalize-data-processing.yml
          rm -f .github/scripts/finalize_data_processing.py
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add Source/DataProcessing/GameComponent_DataProcessingAllocationRegistry.cs .github/workflows/finalize-data-processing.yml .github/scripts/finalize_data_processing.py
          git commit -m "完成数据处理动态分配最终收口修复"
          git push origin HEAD:main
